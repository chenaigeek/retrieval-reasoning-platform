apiVersion: apps/v1
kind: Deployment

metadata:
  name: llm-platform

spec:
  replicas: 3

  selector:
    matchLabels:
      app: llm-platform

  template:
    metadata:
      labels:
        app: llm-platform

    spec:
      containers:

      - name: api

        image: llm-platform:latest

        ports:
        - containerPort: 8000

        envFrom:
        - secretRef:
            name: llm-secrets