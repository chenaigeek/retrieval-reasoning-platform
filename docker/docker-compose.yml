version: "3.8"

services:

  api:
    build:
      context: ..
      dockerfile: docker/Dockerfile

    ports:
      - "8000:8000"

    env_file:
      - ../.env

    depends_on:
      - redis
      - qdrant

  redis:
    image: redis

    ports:
      - "6379:6379"

  qdrant:
    image: qdrant/qdrant

    ports:
      - "6333:6333"